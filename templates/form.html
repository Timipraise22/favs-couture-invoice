<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Invoice</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7fa; padding: 40px; }
        .form-container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .top-nav { margin-bottom: 20px; text-align: right; }
        .top-nav a { text-decoration: none; color: #fff; background: #555; padding: 10px 15px; border-radius: 4px; font-weight: bold; }
        h1 { text-align: center; color: #333; }
        .form-section { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .form-section h3 { margin-bottom: 15px; color: #555; }
        .form-group { margin-bottom: 15px; display: flex; flex-direction: column; }
        .form-row { display: flex; gap: 15px; margin-bottom: 10px; }
        .form-row .form-group { flex: 1; }
        label { font-weight: bold; margin-bottom: 5px; font-size: 14px; color: #333; }
        input, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button.submit-btn { background: #000; color: #fff; border: none; padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; width: 100%; margin-top: 20px; }
        button.submit-btn:hover { background: #333; }
        .add-item-btn { background: #444; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 4px; margin-bottom: 20px; }
    </style>
</head>
<body>
<div class="form-container">
    <div class="top-nav">
        <a href="/history">View Invoice History &rarr;</a>
    </div>
    <h1>Create Invoice</h1>
    
    <form action="/generate" method="POST" oninput="calculateTotals()">
        <div class="form-section">
            <h3>Your Company Details</h3>
            <div class="form-row">
                <div class="form-group"><label>Company Name</label><input type="text" name="company_name" value="Fav's Couture" required></div>
                <div class="form-group"><label>Email</label><input type="email" name="company_email" value="fummitavour56@gmail.com" required></div>
                <div class="form-group"><label>Phone</label><input type="text" name="company_phone" value="+2348100268552" required></div>
            </div>
            <div class="form-group"><label>Address</label><textarea name="company_address" rows="3" required>10, Amadi Street, Off LASU Close&#10;Ojo Lagos&#10;NG</textarea></div>
        </div>

        <div class="form-section">
            <h3>Client Details</h3>
            <div class="form-row">
                <div class="form-group"><label>Client Name</label><input type="text" name="client_name" placeholder="e.g. John Doe" required></div>
                <div class="form-group"><label>Client Phone</label><input type="text" name="client_phone" placeholder="e.g. +234..."></div>
            </div>
        </div>

        <div class="form-section">
            <h3>Invoice Items</h3>
            <div id="items-container">
                <div class="item-row">
                    <div class="form-row">
                        <div class="form-group"><label>Item Name</label><input type="text" name="item_name[]" placeholder="e.g. Asoebi" required></div>
                        <div class="form-group"><label>Quantity</label><input type="number" name="item_quantity[]" class="qty" value="1" required></div>
                        <div class="form-group"><label>Price (₦)</label><input type="number" name="item_price[]" class="price" value="0" required></div>
                    </div>
                    <div class="form-group"><label>Description</label><textarea name="item_description[]" rows="2"></textarea></div>
                    <hr style="border: 0; border-top: 1px solid #ddd; margin: 10px 0;">
                </div>
            </div>
            <button type="button" class="add-item-btn" onclick="addItem()">+ Add New Item</button>
        </div>

        <div class="form-section">
            <h3>Totals & Payment Info</h3>
            <div class="form-row">
                <div class="form-group"><label>Subtotal</label><input type="text" id="subtotal" name="subtotal" readonly></div>
                <div class="form-group"><label>Discount</label><input type="number" id="discount" name="discount" value="0" min="0" step="0.01"></div>
                <div class="form-group"><label>Paid Amount</label><input type="number" id="paid_amount" name="paid_amount" value="0" min="0" step="0.01"></div>
                <div class="form-group"><label>Amount Due</label><input type="text" id="amount_due" name="amount_due" readonly></div>
            </div>
            <div class="form-row">
                <div class="form-group"><label>Account No</label><input type="text" name="account_no" value="8107888638"></div>
                <div class="form-group"><label>Account Name</label><input type="text" name="account_name" value="Atanda Funmilayo"></div>
                <div class="form-group"><label>Bank</label><input type="text" name="bank" value="Opay"></div>
            </div>
        </div>
        <button type="submit" class="submit-btn">Generate Invoice</button>
    </form>
</div>

<script>
    function addItem() {
        const container = document.getElementById('items-container');
        const rowTemplate = document.querySelector('.item-row');
        const newRow = rowTemplate.cloneNode(true);
        newRow.querySelectorAll('input, textarea').forEach(input => input.value = '');
        container.appendChild(newRow);
    }

    function calculateTotals() {
        let subtotal = 0;
        const rows = document.querySelectorAll('.item-row');
        
        rows.forEach(row => {
            const qty = parseFloat(row.querySelector('.qty').value) || 0;
            const price = parseFloat(row.querySelector('.price').value) || 0;
            subtotal += (qty * price);
        });

        const discount = parseFloat(document.getElementById('discount').value) || 0;
        const paidAmount = parseFloat(document.getElementById('paid_amount').value) || 0;
        const total = subtotal - discount - paidAmount;

        document.getElementById('subtotal').value = subtotal.toFixed(2);
        document.getElementById('amount_due').value = total.toFixed(2);
    }
</script>

</body>
</html>
